[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pendant-local-api"
version = "0.5.0"
description = "A local recording workspace, Bluetooth client and HTTP API for Limitless Pendant"
readme = "README.md"
license-files = ["LICENSE", "LICENSES/*", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.53.0", "bleak==3.0.2",
  "cryptography==50.0.1", "protobuf==7.36.1", "click==8.5.0",
  "httpx==0.28.1", "platformdirs==4.11.8", "filelock>=3.16,<5",
  "python-multipart==0.0.32",
]

[project.urls]
Homepage = "https://github.com/jonathan-tipper/pendant-local"
Documentation = "https://github.com/jonathan-tipper/pendant-local#readme"
Issues = "https://github.com/jonathan-tipper/pendant-local/issues"
Releases = "https://github.com/jonathan-tipper/pendant-local/releases"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
protocol = ["grpcio-tools==1.84.0"]
transcription = ["faster-whisper==1.2.1"]
diarization = ["faster-whisper==1.2.1", "sherpa-onnx==1.13.8"]

[project.scripts]
pendant-local = "pendant_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pendant_api = ["static/*", "ui/*"]
pendant_client = ["proto/*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
