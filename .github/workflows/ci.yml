name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: macos-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Update installer
        run: python -m pip install --upgrade 'pip>=26.2'
      - name: Install core and test dependencies (no models)
        run: python -m pip install -e '.[dev]' build
      - name: Check dependency consistency
        run: python -m pip check
      - name: Tests
        run: python -m pytest -q
      - name: JavaScript syntax
        run: node --check src/pendant_api/ui/app.js
      - name: Source, links and bundled asset checks
        run: python scripts/check_release.py
      - name: Build source and wheel distributions
        run: python -m build
      - name: Smoke test packaged assets and authentication
        run: python scripts/smoke_wheel.py
