name: Dependency audit
on:
  push:
    paths: ['pyproject.toml', '.github/workflows/dependencies.yml']
  pull_request:
    paths: ['pyproject.toml', '.github/workflows/dependencies.yml']
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install -e . pip-audit
      - name: Audit installed core dependencies
        run: python -m pip_audit --skip-editable
